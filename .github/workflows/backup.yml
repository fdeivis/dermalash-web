name: Respaldo automático

on:
  schedule:
    # 09:00 UTC = 04:00 hora de Perú (UTC-5), fuera de horario de atención.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pg_dump 17
        # El runner trae por defecto el cliente de Postgres 16, que no puede
        # volcar un servidor más nuevo (Supabase corre Postgres 17). Se agrega
        # el repositorio oficial de PostgreSQL (PGDG) para instalar la
        # versión 17 del cliente en vez de la que trae Ubuntu por defecto.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # El runner ya trae instalado pg_dump 16 en /usr/bin; se antepone
          # la carpeta de la versión 17 al PATH de los pasos siguientes para
          # que se use esa en vez de la vieja.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar respaldo
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node scripts/backup.mjs
